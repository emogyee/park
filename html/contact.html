<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact Park to plan your next unforgettable trip across Nigeria."
    />
    <link rel="icon" type="image/png" href="../images/park.png" />
    <title>Park | Contact Us</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
        <a
          class="navbar-brand fw-bold fs-3"
          href="../index.html"
          aria-label="Park home page"
        >
          <img src="../images/park.png" alt="Park Logo" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact Us</a>
            </li>
          </ul>
          <a href="explore.html" class="btn btn-warning ms-lg-3">Explore Now</a>
        </div>

        <button
          id="themeToggle"
          class="theme-toggle ms-2"
          type="button"
          aria-label="Switch to dark mode"
        >
          🌙
        </button>
      </div>
    </nav>

    <main>
      <section id="contact" class="py-5">
        <div class="container py-5">
          <div class="text-center mb-5">
            <p class="section-tag">Contact</p>
            <h2 class="section-title text-white">Plan Your Adventure</h2>
          </div>

          <div class="row justify-content-center">
            <div class="col-lg-7">
              <form class="form-panel">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Your name"
                    />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      placeholder="Your email"
                    />
                  </div>

                  <div class="col-12">
                    <label class="form-label">Destination</label>
                    <select class="form-select">
                      <option selected>Choose a destination</option>
                      <option>Lagos</option>
                      <option>Abuja</option>
                      <option>Calabar</option>
                      <option>Jos</option>
                      <option>Obudu</option>
                      <option>Enugu</option>
                    </select>
                  </div>

                  <div class="col-12">
                    <label class="form-label">Message</label>
                    <textarea
                      class="form-control"
                      rows="5"
                      placeholder="Tell us about your trip..."
                    ></textarea>
                  </div>

                  <div class="col-12">
                    <button type="submit" class="btn btn-success w-100">
                      Send Message
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-5">
            <a class="navbar-brand fw-bold fs-3" href="../index.html">
              <img src="../images/park.png" alt="Park logo" />
            </a>
            <p class="text-secondary">
              Discover the beauty, culture and adventure of Nigeria.
            </p>
          </div>

          <div class="col-6 col-lg-3">
            <h5>Quick Links</h5>
            <a
              href="../index.html"
              class="d-block text-secondary text-decoration-none mb-2"
              >Home</a
            >
            <a
              href="about.html"
              class="d-block text-secondary text-decoration-none mb-2"
              >About</a
            >
            <a
              href="contact.html"
              class="d-block text-secondary text-decoration-none mb-2"
              >Contact</a
            >
            <a
              href="explore.html"
              class="d-block text-secondary text-decoration-none"
              >Explore Now</a
            >
          </div>

          <div class="col-6 col-lg-4">
            <h5>Follow Us</h5>
            <div class="d-flex gap-3 fs-4">
              <a
                href="https://facebook.com"
                class="text-white"
                aria-label="Facebook"
                ><i class="bi bi-facebook"></i
              ></a>
              <a
                href="https://instagram.com"
                class="text-white"
                aria-label="Instagram"
                ><i class="bi bi-instagram"></i
              ></a>
              <a
                href="https://twitter.com"
                class="text-white"
                aria-label="Twitter"
                ><i class="bi bi-twitter-x"></i
              ></a>
              <a
                href="https://youtube.com"
                class="text-white"
                aria-label="YouTube"
                ><i class="bi bi-youtube"></i
              ></a>
            </div>
          </div>
        </div>

        <hr class="my-4" />
        <p class="text-secondary mb-0 text-center">
          © 2026 Park. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="../script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
